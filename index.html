<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robert Johnson</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="https://kit.fontawesome.com/279f898cf5.js" crossorigin="anonymous"></script>
</head>
<body>
    <section id="about-me">
        <nav>
            <div class="personal__logo">Robert Johnson</div>
            <ul class="nav__link--list">
               <li>
               <a href="" class="
                nav__link--anchor
                link__hover-effect
                link__hover-effect--black">Languages</a>
               </li> 
               <li>
                <a href="" class="
                nav__link--anchor
                link__hover-effect
                link__hover-effect--black">Project</a>
               </li> 
               <li>
                <a href="" class="
                nav__link--anchor
                nav__link--anchor-primary">Contact</a>
               </li> 
            </ul>
        </nav>
        <div class="flex flex-1">
            <div class="about-me__info row">
                <div class="about-me__info--container">
                    <figure class="about-me__picture--mask">
                        <img src="./assets/My-Picture.jpg" class="about-me__picture" alt="Profile Picture">
                    </figure>
                    <h1 class="about-me__info--title">
                       Hey! I'm <span class="text--red">Robert Johnson🤘</span> 
                    </h1>
                    <p class="about-me__info--paragraph">
                        I'm starting as a <strong class="text--red">frontend developer</strong> and I'm slowly but surely learning more and more as the days go bye. I have a strong focus on making websites clean and organized, and above all, easy to navigate!
                    </p>
                    <div class="about-me__links">
                        <a href="" class="about-me__link">
                            <i class="fa-brands fa-square-linkedin"></i>
                        </a>
                        <a href="" class="about-me__link">
                            <i class="fa-brands fa-square-github"></i>
                        </a>
                        <a href="" class="about-me__link">
                            <i class="fa-solid fa-envelope"></i>
                        </a>
                        <a href="" class="about-me__link">
                            <i class="fa-solid fa-file"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
